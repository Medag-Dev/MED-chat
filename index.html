
<!DOCTYPE html>  
<html lang="fr">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>MED chat-Connexion</title> 
<meta name="description" content="MED chat est une plateforme de messagerie en ligne qui offre une expérience immersive et compétitive aux utilisateurs du monde entier. Rejoignez notre communauté et discutez avec vos amis ou des utilisateurs aléatoires dans des conversations passionnantes.">
<meta name="keywords" content="Se connecter,Login,MED chat, messagerie en ligne, plateforme de messagerie, discuter en ligne, communauté de messagerie, conversations en ligne, défis de messagerie, compétition de messagerie, stratégie de messagerie, messagerie en direct">
<link rel="icon" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">

    rel="stylesheet"  
>  
<style>  
  

  
*{  
    margin:0;  
    padding:0;  
    box-sizing:border-box;  
    font-family:"Poppins",sans-serif;  
        -webkit-tap-highlight-color: transparent;
}  
  
html,  
body{  
    width:100%;  
    min-height:100%;  
}  
  
body{  
  
    min-height:100vh;  
  
    display:flex;  
    justify-content:center;  
    align-items:center;  
  
    padding:20px;  
  
    overflow-x:hidden;  
  
    background:#101418;  
  
    color:#fff;  
}  
  

  
.card{  
  
    width:100%;  
    max-width:400px;  
  
    padding:38px 30px;  
  
    background:#181d23;  
  
    border:1px solid #252c34;  
  
    border-radius:20px;  
  
    text-align:center;  
  
    box-shadow:0 20px 50px rgba(0,0,0,.35);  
  
    animation:show .4s ease;  
  
}  
  
  
@keyframes show{  
  
    from{  
        opacity:0;  
        transform:translateY(20px);  
    }  
  
    to{  
        opacity:1;  
        transform:translateY(0);  
    }  
  
}  
  
  

.logo{  
  
    width:90px;  
    height:90px;  
  
    margin:0 auto 20px;  
  
    overflow:hidden;  
  
    border-radius:18px;  
  
}  
  
  
.logo img{  
  
    width:100%;  
    height:100%;  
  
    display:block;  
  
    object-fit:cover;  
  
}  
  


  
h1{  
  
    font-size:30px;  
  
    font-weight:700;  
  
    letter-spacing:.5px;  
  
    color:#f5f5f5;  
  
    margin-bottom:7px;  
  
}  
  
  
.subtitle{  
  
    color:#8e98a4;  
  
    font-size:13px;  
  
    line-height:1.6;  
  
    margin:0 auto 28px;  
  
    max-width:290px;  
  
}  
  
  

  
.google-btn{  
  
    width:100%;  
  
    min-height:52px;  
  
    padding:10px 15px;  
  
    border:1px solid #303841;  
  
    border-radius:12px;  
  
    background:#20262d;  
  
    color:#f1f3f5;  
  
    cursor:pointer;  
  
    font-size:14px;  
  
    font-weight:600;  
  
    display:flex;  
  
    justify-content:center;  
    align-items:center;  
  
    gap:11px;  
  
    transition:  
        background .2s ease,  
        border-color .2s ease,  
        transform .2s ease;  
  
}  
  
  
.google-btn:hover{  
  
    background:#262d35;  
  
    border-color:#3b4550;  
  
    transform:translateY(-2px);  
  
}  
  
  
.google-btn:active{  
  
    transform:scale(.98);  
  
}  
  
  
.google-btn img{  
  
    width:21px;  
    height:21px;  
  
    flex-shrink:0;  
  
}  
  
  

  
.profile{  
  
    display:none;  
  
}  
  
  
.avatar{  
  
    width:100px;  
    height:100px;  
  
    max-width:100%;  
  
    border-radius:50%;  
  
    object-fit:cover;  
  
    border:3px solid #303841;  
  
    display:block;  
  
    margin:0 auto;  
  
}  
  
  
.profile h2{  
  
    margin-top:17px;  
  
    color:#f5f5f5;  
  
    font-size:21px;  
  
    font-weight:600;  
  
    overflow-wrap:anywhere;  
  
}  
  
  
.email{  
  
    color:#8e98a4;  
  
    font-size:13px;  
  
    margin:6px 0 15px;  
  
    overflow-wrap:anywhere;  
  
}  
  
  
.uid{  
  
    max-width:100%;  
  
    padding:10px 12px;  
  
    background:#12161a;  
  
    border:1px solid #252c34;  
  
    border-radius:9px;  
  
    color:#737e89;  
  
    font-size:11px;  
  
    line-height:1.5;  
  
    overflow-wrap:anywhere;  
  
    word-break:break-word;  
  
}  
  
  
.uid span{  
  
    color:#8e98a4;  
  
}  
  

  
.logout{  
  
    margin-top:20px;  
  
    width:100%;  
  
    min-height:45px;  
  
    border:none;  
  
    border-radius:11px;  
  
    background:#c0392b;  
  
    color:#fff;  
  
    font-weight:600;  
  
    cursor:pointer;  
  
    transition:  
        background .2s ease,  
        transform .2s ease;  
  
}  
  
  
.logout:hover{  
  
    background:#d04435;  
  
    transform:translateY(-2px);  
  
}  
  
  
.logout:active{  
  
    transform:scale(.98);  
  
}  
  

  
@media (max-width:600px){  
  
    body{  
  
        padding:16px;  
  
    }  
  
  
    .card{  
  
        width:100%;  
  
        max-width:390px;  
  
        padding:34px 24px;  
  
    }  
  
}  
  
  

  
@media (max-width:480px){  
  
    body{  
  
        padding:14px;  
  
        align-items:center;  
  
    }  
  
  
    .card{  
  
        width:100%;  
  
        max-width:100%;  
  
        padding:32px 20px;  
  
        border-radius:18px;  
  
    }  
  
  
    .logo{  
  
        width:80px;  
        height:80px;  
  
        margin-bottom:18px;  
  
        border-radius:16px;  
  
    }  
  
  
    h1{  
  
        font-size:27px;  
  
    }  
  
  
    .subtitle{  
  
        font-size:12.5px;  
  
        max-width:280px;  
  
        margin-bottom:24px;  
  
    }  
  
  
    .google-btn{  
  
        min-height:50px;  
  
        font-size:13px;  
  
        padding:10px 12px;  
  
    }  
  
}  
  
  

  
@media (max-width:360px){  
  
    body{  
  
        padding:10px;  
  
    }  
  
  
    .card{  
  
        padding:28px 16px;  
  
        border-radius:16px;  
  
    }  
  
  
    .logo{  
  
        width:70px;  
        height:70px;  
  
        margin-bottom:16px;  
  
    }  
  
  
    h1{  
  
        font-size:24px;  
  
    }  
  
  
    .subtitle{  
  
        font-size:12px;  
  
        margin-bottom:21px;  
  
    }  
  
  
    .google-btn{  
  
        min-height:48px;  
  
        font-size:12px;  
  
    }  
  
}  
  
  

  
@media (max-height:600px){  
  
    body{  
  
        align-items:flex-start;  
  
        padding-top:20px;  
        padding-bottom:20px;  
  
    }  
  
}  
  
</style>  </head>  <body>  <div class="card">  <div id="loginBox">  


    <div class="logo">  

        <img  
            src="logo.jpg"  
            alt="MED chat"  
        >  

    </div>  


    <h1>MED chat</h1>  


    <p class="subtitle">  
        Connecte-toi pour discuter en ligne  
    </p>  


    <button  
        id="googleBtn"  
        class="google-btn"  
        type="button"  
    >  

        <img  
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"  
            alt=""  
        >  

        <span>Continuer avec Google</span>  

    </button>  


</div>  


<div id="profileBox" class="profile">  


    <img  
        id="avatar"  
        class="avatar"  
        alt="Photo de profil"  
    >  


    <h2 id="username"></h2>  


    <p id="email" class="email"></p>  


    <p class="uid">  

        ID joueur :  
        <span id="uid"></span>  

    </p>  


    <button  
        id="logoutBtn"  
        class="logout"  
        type="button"  
    >  

        Déconnexion  

    </button>  


</div>

</div>  <script type="module">  
  
import { initializeApp }  
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";  
  
import {  
    getAuth,  
    GoogleAuthProvider,  
    signInWithPopup,  
    signOut,  
    onAuthStateChanged  
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";  
  
  
const firebaseConfig = {  
    apiKey: "AIzaSyDQo8v7Kh4JsLhWQmLM6Jm1nDmDamvphN0",  
    authDomain: "chessora-2ee1c.firebaseapp.com",  
    projectId: "chessora-2ee1c",  
    storageBucket: "chessora-2ee1c.firebasestorage.app",  
    messagingSenderId: "660814980426",  
    appId: "1:660814980426:web:5abb12f61ddac241254db3"  
};  
  
  
const app = initializeApp(firebaseConfig);  
const auth = getAuth(app);  
const provider = new GoogleAuthProvider();  
  
  
const googleBtn = document.getElementById("googleBtn");  
const logoutBtn = document.getElementById("logoutBtn");  
const loginBox = document.getElementById("loginBox");  
  
  
googleBtn.onclick = async () => {  
  
    try {  
  
        await signInWithPopup(auth, provider);  
  
        window.location.href = "accueil.html";  
  
    } catch (error) {  
  
        alert(error.message);  
  
    }  
  
};  
  
  
onAuthStateChanged(auth, (user) => {  
  
    if (user) {  
  
        localStorage.setItem(  
            "chessoraLogin",  
            "true"  
        );  
  
        loginBox.style.display = "none";  
  
        // Si déjà connecté  
        if (location.pathname.includes("index.html")) {  
            window.location.href = "accueil.html";  
        }  
  
    }  
  
});  
  
</script>  
</body> 
</html>
