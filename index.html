<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MED chat - Connexion</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="shortcut icon" href="logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box
        }

        :root {
            --bg: #151411;
            --bg-soft: #1b1916;
            --card: #24211d;
            --card-2: #2d2923;
            --accent: #7fa348;
            --accent-light: #a4c766;
            --accent-dark: #607d36;
            --gold: #d4af37;
            --text: #fff;
            --text-soft: #ddd;
            --muted: #999;
            --border: rgba(255, 255, 255, .08);
            --shadow: 0 25px 70px rgba(0, 0, 0, .38);
            --radius: 25px
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text);
            background: var(--bg)
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% -10%, #2a3020 0%, #191814 34%, var(--bg) 72%);
        }

        .card {
            width: min(100%, 440px);
            background: rgba(36, 33, 29, .97);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 34px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px)
        }

        .brand {
            text-align: center;
            margin-bottom: 28px
        }

        .brand img {
            width: 78px;
            height: 78px;
            border-radius: 22px;
            object-fit: cover;
            display: block;
            margin: 0 auto 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35)
        }

        .brand h1 {
            margin: 0;
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -.7px
        }

        .brand p {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 13px
        }

        .field {
            margin-bottom: 18px
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 700
        }

        .input-wrap {
            position: relative
        }

        .input-wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 15px
        }

        .field input {
            width: 100%;
            height: 50px;
            padding: 0 15px 0 43px;
            border: 1px solid var(--border);
            border-radius: 14px;
            outline: none;
            background: var(--bg-soft);
            color: var(--text);
            font: inherit;
            font-size: 14px;
            transition: .2s
        }

        .field input::placeholder {
            color: #777
        }

        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(127, 163, 72, .12)
        }

        .main-btn,
        .google-btn {
            width: 100%;
            height: 50px;
            border-radius: 14px;
            font: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s
        }

        .main-btn {
            border: 0;
            background: var(--accent);
            color: #fff;
            box-shadow: 0 8px 22px rgba(127, 163, 72, .2)
        }

        .main-btn:hover {
            background: var(--accent-light);
            transform: translateY(-1px)
        }

        .google-btn {
            border: 1px solid var(--border-strong, #ffffff22);
            background: #fff;
            color: #202124
        }

        .google-btn:hover {
            filter: brightness(.96);
            transform: translateY(-1px)
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 21px 0;
            color: #777;
            font-size: 11px;
            font-weight: 700
        }

        .divider:before,
        .divider:after {
            content: "";
            height: 1px;
            background: var(--border);
            flex: 1
        }

        .status {
            min-height: 22px;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
            color: var(--muted)
        }

        .status.success {
            color: #8fd06b
        }

        .status.error {
            color: #ff7770
        }

        .hint {
            margin-top: 18px;
            text-align: center;
            color: #777;
            font-size: 11.5px;
            line-height: 1.55
        }

        .hint i {
            color: var(--accent-light);
            margin-right: 4px
        }

        @media(max-width:480px) {
            body {
                padding: 15px
            }

            .card {
                padding: 26px 21px;
                border-radius: 21px
            }

            .brand {
                margin-bottom: 24px
            }

            .brand img {
                width: 68px;
                height: 68px
            }

            .brand h1 {
                font-size: 26px
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="brand">
            <img src="logo.jpg" alt="MED chat" onerror="this.style.display='none'">
            <h1>MED chat</h1>
            <p>Connecte-toi simplement avec ton adresse e-mail</p>
        </div>

        <form id="authForm">
            <div class="field">
                <label for="email">Adresse e-mail</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-envelope"></i>
                    <input id="email" type="email" autocomplete="email" placeholder="ton@email.com" required>
                </div>
            </div>

            <button class="main-btn" type="submit">
                <i class="fa-solid fa-paper-plane"></i>
                Recevoir mon lien de connexion
            </button>

            <div class="divider">OU</div>

            <button id="googleBtn" class="google-btn" type="button">
                <i class="fa-brands fa-google"></i>
                &nbsp; Continuer avec Google
            </button>
        </form>

        <div id="status" class="status"></div>
        <div class="hint"><i class="fa-solid fa-shield-halved"></i>Aucun mot de passe. Le même lien permet de se
            connecter ou de créer le compte.</div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            GoogleAuthProvider,
            signInWithPopup,
            sendSignInLinkToEmail,
            isSignInWithEmailLink,
            signInWithEmailLink
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQo8v7Kh4JsLhWQmLM6Jm1nDmDamvphN0",
            authDomain: "chessora-2ee1c.firebaseapp.com",
            projectId: "chessora-2ee1c",
            storageBucket: "chessora-2ee1c.firebasestorage.app",
            messagingSenderId: "660814980426",
            appId: "1:660814980426:web:5abb12f61ddac241254db3"
        };

        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        const statusEl = document.getElementById("status");

        const actionCodeSettings = {
            url: window.location.origin + window.location.pathname,
            handleCodeInApp: true
        };

        function status(message, ok = false) {
            statusEl.textContent = message;
            statusEl.className = "status" + (ok ? " success" : " error");
        }

        function errorMessage(error) {
            const code = error?.code || "";
            const messages = {
                "auth/invalid-email": "Adresse e-mail invalide.",
                "auth/missing-email": "Entre ton adresse e-mail.",
                "auth/operation-not-allowed": "La connexion par lien e-mail n'est pas activée dans Firebase.",
                "auth/unauthorized-continue-uri": "Cette adresse n'est pas autorisée dans Firebase Authentication.",
                "auth/invalid-action-code": "Le lien est invalide ou a expiré. Demande un nouveau lien.",
                "auth/expired-action-code": "Le lien a expiré. Demande un nouveau lien.",
                "auth/invalid-verification-code": "Le lien de connexion est invalide."
            };
            return messages[code] || "Une erreur est survenue. Réessaie.";
        }

        async function envoyerLienConnexion(email) {
            const adresse = email.trim();
            if (!adresse) { status("Entre ton adresse e-mail."); return; }
            status("Envoi du lien de connexion...");
            try {
                await sendSignInLinkToEmail(auth, adresse, actionCodeSettings);
                localStorage.setItem("medEmailForSignIn", adresse);
                status("Lien envoyé ! Consulte ta boîte e-mail et ouvre le lien pour te connecter.", true);
            } catch (error) {
                console.error(error);
                status(errorMessage(error));
            }
        }

        document.getElementById("authForm").addEventListener("submit", event => {
            event.preventDefault();
            envoyerLienConnexion(document.getElementById("email").value);
        });

        async function googleLogin() {
            status("Connexion avec Google...");
            try {
                await signInWithPopup(auth, googleProvider);
                window.location.replace("accueil.html");
            } catch (error) {
                console.error(error);
                status(errorMessage(error));
            }
        }

        document.getElementById("googleBtn").addEventListener("click", googleLogin);

        async function terminerConnexionParLien() {
            if (!isSignInWithEmailLink(auth, window.location.href)) return false;

            let email = localStorage.getItem("medEmailForSignIn");
            if (!email) email = window.prompt("Entre ton adresse e-mail pour terminer la connexion :");
            if (!email) {
                status("Adresse e-mail nécessaire pour terminer la connexion.");
                return true;
            }

            status("Validation du lien de connexion...");
            try {
                await signInWithEmailLink(auth, email.trim(), window.location.href);
                localStorage.removeItem("medEmailForSignIn");
                window.history.replaceState({}, document.title, window.location.pathname);
                window.location.replace("accueil.html");
            } catch (error) {
                console.error(error);
                status(errorMessage(error));
            }
            return true;
        }

        const lienEnCours = await terminerConnexionParLien();

        onAuthStateChanged(auth, user => {
            if (user && !lienEnCours) window.location.replace("accueil.html");
        });
    </script>
</body>

</html>
